<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamFlix — Fiche série</title>
    <meta
      name="description"
      content="Fiche détaillée d'une série : résumé, genres, note, distribution et diffusion."
    />
  </head>
  <body>
    <header>
      <h1>StreamFlix</h1>

      <button
        type="button"
        id="bouton-menu"
        aria-expanded="false"
        aria-controls="menu-principal"
      >
        Menu
      </button>

      <nav id="menu-principal">
        <ul>
          <li><a href="index.html">Catalogue</a></li>
          <li>
            <a href="liste.html">Ma liste</a> <span id="compteur-liste">0</span>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="fiche-serie">
        <p id="statut-fiche" role="status" aria-live="polite"></p>

        <div id="contenu-fiche"></div>

        <button type="button" id="bouton-ajouter-liste">
          Ajouter à ma liste
        </button>
      </section>
    </main>

    <footer>
      <p>StreamFlix</p>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
